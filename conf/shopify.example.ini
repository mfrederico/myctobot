[shopify]
; Shopify App OAuth credentials
; Get these from your Shopify Partners dashboard > Apps > Your App > Client credentials
api_key=""
api_secret=""

; Redirect URI - must match what's configured in Shopify app settings
; Use workspace subdomain for unified connector flow
redirect_uri="https://YOUR_WORKSPACE.myctobot.ai/connections/callback/shopify"

; Shopify CLI path - absolute path to shopify executable
; Find your path with: which shopify
; Development (nvm): /home/user/.nvm/versions/node/v22.18.0/bin/shopify
; Production (global): /usr/local/bin/shopify or /usr/bin/shopify
cli_path="/usr/local/bin/shopify"

; OAuth scopes - comma-separated, no spaces
; Full set of scopes for complete Shopify integration (orders, customers, products, themes, etc.)
; You can customize this list based on your app's needs
scopes="read_analytics,read_assigned_fulfillment_orders,read_customer_events,read_channels,read_custom_fulfillment_services,write_customers,write_customer_merge,write_price_rules,write_discounts,write_discounts_allocator_functions,write_draft_orders,read_draft_orders,write_files,write_gift_card_transactions,write_gift_cards,read_inventory,read_inventory_shipments,read_inventory_shipments_received_items,read_inventory_transfers,write_locations,read_marketing_integrated_campaigns,write_marketing_integrated_campaigns,write_marketing_events,read_marketing_events,read_markets,write_markets,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_online_store_pages,write_online_store_pages,read_order_edits,write_orders,read_product_feeds,read_product_listings,read_products,write_products,read_returns,write_returns,read_script_tags,write_script_tags,read_shopify_payments_disputes,write_shopify_payments_disputes,read_content,write_content,write_theme_code,read_themes,write_themes,read_translations,write_translations,customer_read_companies,customer_write_companies,customer_write_customers,customer_read_customers,customer_read_draft_orders,customer_read_markets,customer_read_metaobjects,customer_read_orders,customer_write_orders,unauthenticated_write_customers,unauthenticated_read_customers,unauthenticated_read_customer_tags,unauthenticated_read_metaobjects,unauthenticated_read_product_inventory,unauthenticated_read_product_listings,unauthenticated_read_product_tags,unauthenticated_read_selling_plans,unauthenticated_read_content,read_customers,read_customer_merge,read_price_rules,read_discounts,read_discounts_allocator_functions,read_files,read_gift_card_transactions,read_gift_cards,read_locations,read_orders"
