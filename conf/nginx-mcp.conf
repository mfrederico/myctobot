# MyCTOBot MCP Gateway - Nginx Upstream Configuration
# ====================================================
#
# This replaces the PHP-FPM /mcp location with a proxy to the fastmcphp
# SSE server running on port 8003.
#
# Installation:
#   1. Start fastmcphp: ./bin/fastmcphp serve --myctobot-path=/var/www/html/default/myctobot --port=8003
#   2. Replace the /mcp location block in /etc/nginx/xpi/dynamic_hosts.conf with this
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# URL Pattern:
#   https://{workspace}.myctobot.ai/mcp/sse?token=tk_xxx
#   POST https://{workspace}.myctobot.ai/mcp/message?sessionId=xxx

# Upstream definition for fastmcphp SSE server
upstream mcp_gateway {
    server 127.0.0.1:8003;
    keepalive 32;
}

# SSE endpoint - requires special settings for streaming
location = /mcp/sse {
    # Extract workspace from subdomain and pass to upstream
    set $workspace $subdomain;  # Assumes $subdomain is set elsewhere in config

    # SSE/streaming settings - CRITICAL
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;  # 24 hours for long-lived connections
    gzip off;
    chunked_transfer_encoding on;

    # HTTP/1.1 for keep-alive streaming
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header X-Accel-Buffering no;

    # Forward client info
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Workspace $workspace;

    # Pass query params (includes workspace and token)
    proxy_pass http://mcp_gateway/sse$is_args$args;
}

# Message endpoint - standard HTTP POST for JSON-RPC
location = /mcp/message {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass query params (includes sessionId)
    proxy_pass http://mcp_gateway/message$is_args$args;
}

# Health check
location = /mcp/health {
    proxy_pass http://mcp_gateway/health;
}
