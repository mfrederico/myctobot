; MyCTOBot Platform Pricing Configuration
; =======================================
; All prices in USD
; Simplified tiered platform pricing (January 2026)
;
; Pricing philosophy:
; - A junior PHP developer costs ~$7,000/month fully loaded
; - Our base cost per tenant is ~$440/month
; - Target 70-80% gross margins on paid tiers

[platform]
; Unified platform tiers - this is the primary pricing model
; All features bundled by tier, not sold separately
; No free tier - $440/tenant cost makes it unsustainable
; All paid tiers include 14-day free trial

; Starter tier - small teams getting started
starter_monthly = 749
starter_projects = 3
starter_ai_jobs = 50
starter_code_review = true
starter_pipelines_basic = true
starter_integrations = "github,jira"
starter_support = "email"

; Pro tier - primary revenue driver
pro_monthly = 1999
pro_projects = 0  ; 0 = unlimited
pro_ai_jobs = 0   ; unlimited
pro_code_review = true
pro_pipelines_full = true
pro_ai_agents = true
pro_integrations = "all"
pro_support = "priority"

; Enterprise tier
enterprise_monthly = 5000
enterprise_minimum = 5000  ; starting at
enterprise_projects = 0    ; unlimited
enterprise_ai_jobs = 0     ; unlimited
enterprise_dedicated_infra = true
enterprise_custom_integrations = true
enterprise_sla = true
enterprise_onboarding = "white-glove"
enterprise_support = "dedicated"

; Discount for annual billing
yearly_discount = 0.20

[global]
; Global settings
currency = "USD"
currency_symbol = "$"
trial_days = 14

