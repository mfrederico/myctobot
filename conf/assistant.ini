; MyCTOBOT Assistant Configuration
; This file configures the AI assistant widget

[general]
; Display name shown in the assistant panel header
name = "MyCTOBOT Assistant"

; Whether to enable the assistant (true/false)
enabled = true

; Position on screen: bottom-left, bottom-right
position = "bottom-left"

[websocket]
; WebSocket server port
port = 9510

; Host to bind (0.0.0.0 for all interfaces)
host = "0.0.0.0"

[ollama]
; Ollama API endpoint
host = "http://127.0.0.1:11434"

; Model to use for responses
;model = "qwen3-coder:30b"
model = "kimi-k2.5:cloud"

; Context window size (num_ctx for Ollama)
; qwen3-coder:30b supports up to 256k. Default was 32768 which is too small
; when system prompt includes sitemap, RAG, MCP tools, and page context.
context_size = 65536

[rag]
; RAG service endpoint (the vector database service)
service_url = "http://localhost:9501"

; Enable RAG queries to augment assistant responses
enabled = true

; Specific knowledge base slug to query (leave empty for all KBs)
kb_slug = ""

; Similarity threshold for results (0.0 - 1.0)
similarity_threshold = 0.4

; Maximum number of results to include
max_results = 3

[knowledge]
; Enable local knowledge store (page definitions, etc.)
enabled = true

; Maximum number of knowledge entries to include in context
max_entries = 5

; Minimum similarity score for knowledge retrieval (0.0 - 1.0)
min_similarity = 0.5

; Path to knowledge store (relative to storage/assist/{workspace}/)
path = "knowledge.sqlite"

[behavior]
; Maximum response length hint for the LLM
max_response_length = "brief"

; Enable action execution (highlight, fill, navigate, etc.)
actions_enabled = true

; Default highlight duration in milliseconds
highlight_duration = 3000

[mcp]
; Enable MCP tool calling (allows assistant to call pipelines, etc.)
enabled = true

; Path to .mcp.json config file (optional, relative to project root)
config_path = ".mcp.json"

; Or specify MCP servers directly:
; [mcp.servers.myctobot]
; type = "http"
; url = "https://{workspace}.myctobot.ai/mcp/pipelines"
; headers[] = "Authorization: Bearer {token}"
