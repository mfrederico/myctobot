; Stripe configuration
; Get your keys from https://dashboard.stripe.com/apikeys
; Copy this file to conf/stripe.ini and fill in real values.
; Use test keys (sk_test_*, pk_test_*) for development, live keys only in production.

[stripe]
; Live keys
secret_key = "sk_live_YOUR_STRIPE_SECRET_KEY"
publishable_key = "pk_live_YOUR_STRIPE_PUBLISHABLE_KEY"

; Webhook signing secret (create a webhook endpoint at https://dashboard.stripe.com/webhooks)
webhook_secret = "whsec_YOUR_STRIPE_WEBHOOK_SIGNING_SECRET"

; Price IDs - create products+prices in Stripe Dashboard > Products
pro_monthly_price_id = "price_YOUR_PRO_MONTHLY_PRICE_ID"
; pro_yearly_price_id = ""
business_monthly_price_id = ""
; business_yearly_price_id = ""

; Success/Cancel URLs for checkout redirects
success_url = "https://yourdomain.example.com/settings/subscription?success=1"
cancel_url = "https://yourdomain.example.com/settings/subscription?canceled=1"

; Free trial period (days)
trial_days = 14

; Display pricing (in dollars, for UI only - update when you change Stripe prices)
pro_monthly_price = 150
pro_yearly_price = 1800

; Test-mode keys (optional - for running the app against Stripe test environment)
test_secret_key = "sk_test_YOUR_STRIPE_TEST_SECRET_KEY"
test_publishable_key = "pk_test_YOUR_STRIPE_TEST_PUBLISHABLE_KEY"
