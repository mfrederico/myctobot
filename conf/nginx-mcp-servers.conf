# MyCTOBot MCP Gateway - Location Blocks
# =======================================
#
# Add these location blocks to your server config.
# Requires: mcp_gateway upstream (see nginx-mcp-upstreams.conf)
#
# URL Pattern:
#   https://{workspace}.myctobot.ai/mcp/sse?token=tk_xxx
#   POST https://{workspace}.myctobot.ai/mcp/message?sessionId=xxx

# SSE endpoint - requires special settings for streaming
location = /mcp/sse {
    # SSE/streaming settings - CRITICAL
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;  # 24 hours for long-lived connections
    gzip off;
    chunked_transfer_encoding on;

    # HTTP/1.1 for keep-alive streaming
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header X-Accel-Buffering no;

    # Forward client info
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass query params (includes workspace and token)
    proxy_pass http://mcp_gateway/sse$is_args$args;
}

# Message endpoint - standard HTTP POST for JSON-RPC
location = /mcp/message {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass query params (includes sessionId)
    proxy_pass http://mcp_gateway/message$is_args$args;
}

# Health check
location = /mcp/health {
    proxy_pass http://mcp_gateway/health;
}
