; Atlassian OAuth 2.0 (3LO) configuration
; Register an app at https://developer.atlassian.com/console/myapps/ and copy its client_id/client_secret here.
; Copy this file to conf/atlassian.ini and fill in real values.

[atlassian]
; Comma/space-separated list of OAuth scopes your integration needs.
; See https://developer.atlassian.com/cloud/jira/platform/scopes-for-oauth-2-3LO-and-forge-apps/
scopes = "read:jira-work read:jira-user write:jira-work offline_access"

; Optional: broader scopes used by test utilities only
test_scopes = "read:jira-work read:jira-user offline_access"

client_id = "YOUR_ATLASSIAN_CLIENT_ID"
client_secret = "YOUR_ATLASSIAN_CLIENT_SECRET"
