# MyCTOBot MCP Gateway - Upstream Definition
# ==========================================
#
# Add this to your upstreams.conf or include it separately.
# The fastmcphp SSE server must be running on port 8003.
#
# Start gateway: ./bin/fastmcphp serve --myctobot-path=/var/www/html/default/myctobot --port=8003

upstream mcp_gateway {
    server 127.0.0.1:8003;
    keepalive 32;
}
