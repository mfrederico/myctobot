; Claude CLI authentication for AI Developer runners
;
; Copy the [claude] section below into conf/config.{workspace}.ini.
;
; WHY THIS EXISTS
; Without a token, runners fall back to the workstation's stored login
; (~/.claude/.credentials.json). That access token lives about 8 hours, and
; every agent shares the one file. When several start at once they each try to
; refresh it, one wins and rotates the refresh token, and the losers are left
; holding a stale one. Those agents start, print
;   Login expired - Please run /login
; and park at a prompt forever - session alive, doing nothing, still holding a
; concurrency slot. Three of those and every new dispatch is refused.
;
; A long-lived token has no such race.
;
; HOW TO MINT ONE
; On the workstation, as the account the runners use:
;
;   claude setup-token
;
; It prints a token. Paste it below. It bills against the Claude subscription,
; NOT API credits - this is not the same trade as ANTHROPIC_API_KEY.
;
; SCOPE
; setup-token sessions carry `user:inference` only. That is what running the
; model needs. It does mean no Remote Control and no Claude in Chrome from
; these sessions; a headless runner uses neither.
;
; ROTATION
; If the token is revoked or expires the CLI reports
;   OAuth 401: ... Mint a fresh token with `claude setup-token`
; Re-run the command and replace the value here. The reaper recognises that
; banner and will reap + report affected jobs rather than let them hang.

[claude]
oauth_token = ""
