; Mailgun configuration
; Get your keys from https://app.mailgun.com/mg/sending/<your-domain>/domain-settings
; Copy this file to conf/mailgun.ini and fill in real values.

key = "YOUR_MAILGUN_PRIVATE_API_KEY"
apiKey = "YOUR_MAILGUN_SENDING_API_KEY"
domain = "mg.yourdomain.com"
fromEmail = "noreply@yourdomain.com"
fromName = "Your App Notifications"

; Mailgun webhook signing key - used to verify incoming webhook callbacks.
; See https://app.mailgun.com/mg/sending/webhooks/settings
webhookSigningKey = "YOUR_MAILGUN_WEBHOOK_SIGNING_KEY"

; Shared secret required on incoming webhook URLs. Set to a random string.
webhook_key = "change_this_to_a_random_value"
