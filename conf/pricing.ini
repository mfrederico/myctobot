; MyCTOBot Product Pricing Configuration
; ======================================
; All prices in USD
; Yearly discount is applied as: monthly * 12 * (1 - yearly_discount)
; Example: $79/mo with 20% discount = $79 * 12 * 0.80 = $758.40/year

[ai-developer]
; AI Developer - Label tickets, get PRs
name = "AI Developer"
tagline = "Label tickets, get PRs"
description = "Label any Jira ticket with ai-dev and wake up to a pull request"

; Starter tier
starter_monthly = 150
starter_jobs = 20

; Pro tier
pro_monthly = 500
pro_jobs = 100

; Enterprise tier
enterprise_monthly = 2000
enterprise_jobs = 0  ; 0 = unlimited

; Discount
yearly_discount = 0.20

[pipelines]
; AI Pipelines - Automation with AI agents
name = "AI Pipelines"
tagline = "Automation with AI"
description = "Build powerful automation workflows with AI agents, shell commands, and webhooks"

; Starter tier
starter_monthly = 79
starter_pipelines = 5
starter_runs = 100

; Pro tier
pro_monthly = 299
pro_pipelines = 25
pro_runs = 1000

; Enterprise tier
enterprise_monthly = 999
enterprise_pipelines = 0  ; unlimited
enterprise_runs = 0  ; unlimited

; Discount
yearly_discount = 0.20

[code-review]
; AI Code Review - Every PR reviewed
name = "AI Code Review"
tagline = "Every PR reviewed"
description = "AI-powered code review that catches bugs, security issues, and style violations"

; Starter tier
starter_monthly = 49
starter_repos = 3
starter_reviews = 50

; Pro tier
pro_monthly = 149
pro_repos = 10
pro_reviews = 500

; Enterprise tier
enterprise_monthly = 499
enterprise_repos = 0  ; unlimited
enterprise_reviews = 0  ; unlimited

; Discount
yearly_discount = 0.20

[php-modernization]
; PHP Modernization - Upgrade to PHP 8.x
name = "PHP Modernization"
tagline = "Upgrade to PHP 8.x"
description = "AI-powered PHP upgrades that modernize your legacy codebase"

; Project-based pricing (one-time)
small_project = 2500
small_files = 50

medium_project = 7500
medium_files = 200

large_project = 15000
large_files = 500

enterprise_project = 25000
enterprise_files = 0  ; unlimited / custom

[shopify-themes]
; Shopify Theme Factory - Email to theme
name = "Shopify Themes"
tagline = "Email to theme"
description = "Email your design requirements and receive a production-ready Shopify theme"

; Theme packages (one-time)
starter_theme = 5000
starter_sections = 10
starter_revisions = 2

pro_theme = 10000
pro_sections = 25
pro_revisions = 5

enterprise_theme = 15000
enterprise_sections = 0  ; unlimited
enterprise_revisions = 0  ; unlimited

; Optional monthly maintenance
maintenance_monthly = 500

[enterprise]
; Enterprise Platform - Everything included
name = "Enterprise Platform"
tagline = "Everything included"
description = "Full platform access with all products, dedicated workstations, and priority support"

; Base platform pricing
monthly = 10000

; Includes
includes_ai_developer = true
includes_pipelines = true
includes_code_review = true
includes_php_modernization_discount = 0.25  ; 25% off projects
includes_shopify_discount = 0.25  ; 25% off themes

; Discount
yearly_discount = 0.15

[global]
; Global settings
currency = "USD"
currency_symbol = "$"
trial_days = 14
